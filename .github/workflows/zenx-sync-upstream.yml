# ZenX: daily merge of upstream Zen (zen-browser/desktop) into our fork.
#
# - Merges upstream/dev into a fresh `zenx/upstream-sync` branch built from our `dev`
#   and opens (or refreshes) a PR into `dev`. The PR triggers `pr-test.yml`, which
#   downloads Firefox and checks that all patches still apply.
# - On merge conflicts the job fails and opens (or comments on) an issue labelled
#   `upstream-sync-conflict` with the list of conflicting files.
#
# Requires the `SYNC_PAT` secret: a fine-grained token for this repo with
# Contents, Pull requests, Issues and Workflows set to read & write. The default
# GITHUB_TOKEN cannot push changes to .github/workflows/ (upstream edits them often),
# and PRs it opens do not trigger other workflows.

name: ZenX - Sync upstream Zen

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: zenx-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge zen-browser/desktop
    if: github.repository == 'doctorspider42/ZenX'
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: zen-browser/desktop
      UPSTREAM_BRANCH: dev
      BASE_BRANCH: dev
      SYNC_BRANCH: zenx/upstream-sync
      CONFLICT_LABEL: upstream-sync-conflict
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
    steps:
      - name: Require SYNC_PAT
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing SYNC_PAT secret (see the header of this workflow)."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.SYNC_PAT }}

      - name: Fetch upstream
        run: |
          git config user.name "zenx-sync[bot]"
          git config user.email "zenx-sync@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPO.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"

      - name: Check for new upstream commits
        id: check
        run: |
          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with $UPSTREAM_REPO@$UPSTREAM_BRANCH."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")" >> "$GITHUB_OUTPUT"
            echo "count=$(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH")" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        id: merge
        if: steps.check.outputs.needed == 'true'
        run: |
          git checkout -B "$SYNC_BRANCH"
          if git merge --no-ff --no-edit -m "Merge $UPSTREAM_REPO@$UPSTREAM_BRANCH (${{ steps.check.outputs.upstream_sha }})" "upstream/$UPSTREAM_BRANCH"; then
            exit 0
          fi
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
          git merge --abort
          echo "::error::Merge conflicts with $UPSTREAM_REPO@$UPSTREAM_BRANCH:"
          sed 's/^/::error::  /' "$RUNNER_TEMP/conflicts.txt"
          exit 1

      - name: Push and open PR
        if: steps.check.outputs.needed == 'true'
        run: |
          git push --force origin "$SYNC_BRANCH"
          title="Sync with upstream Zen (${{ steps.check.outputs.upstream_sha }})"
          body="Automatic merge of \`$UPSTREAM_REPO@$UPSTREAM_BRANCH\` (${{ steps.check.outputs.count }} new commits) into \`$BASE_BRANCH\`.

          Generated by [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          pr=$(gh pr list --head "$SYNC_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body "$body"
          else
            gh pr create --head "$SYNC_BRANCH" --base "$BASE_BRANCH" --title "$title" --body "$body"
          fi

      - name: Close resolved conflict issues
        if: steps.check.outputs.needed == 'true'
        run: |
          for n in $(gh issue list --label "$CONFLICT_LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Upstream merges cleanly again (${{ steps.check.outputs.upstream_sha }})."
          done

      - name: Report conflicts
        if: failure() && steps.merge.outcome == 'failure'
        run: |
          gh label create "$CONFLICT_LABEL" --color B60205 \
            --description "Daily upstream Zen merge has conflicts" 2>/dev/null || true
          {
            echo "Merging \`$UPSTREAM_REPO@$UPSTREAM_BRANCH\` (${{ steps.check.outputs.upstream_sha }}) into \`$BASE_BRANCH\` produced conflicts in:"
            echo
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
            echo
            echo "Resolve on a branch and open a PR into \`$BASE_BRANCH\` (see the \`zenx-upstream-sync\` skill in \`.claude/skills\`):"
            echo
            echo '```bash'
            echo "git fetch upstream && git checkout $BASE_BRANCH && git pull"
            echo "git checkout -b zenx/upstream-sync-manual && git merge upstream/$UPSTREAM_BRANCH"
            echo '```'
            echo
            echo "[Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > "$RUNNER_TEMP/issue.md"
          existing=$(gh issue list --label "$CONFLICT_LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Upstream Zen merge conflicts" \
              --label "$CONFLICT_LABEL" --body-file "$RUNNER_TEMP/issue.md"
          fi
